<head>

<title>Quang hợp ở thực vật C4 – Cây ngô</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Playfair+Display:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D stage; a floating instrument panel on the right (bottom sheet on phones); labels float over the scene. Deliberately single dark theme, like a microscope bench. */
:root{
  --bg:#09130f;
  --panel:rgba(11,21,17,.86);
  --panel-2:rgba(255,255,255,.04);
  --fg:#e6eee2;
  --muted:#93a99a;
  --line:rgba(196,224,203,.15);
  --kernel:#e8b84a;
  --kernel-ink:#1c1505;
  --chloro:#7cc35f;
  --m-co2:#d3dde0; --m-pep:#8be063; --m-oaa:#ff9b5e; --m-mal:#c697ff; --m-pyr:#52d6e6;
  --m-atp:#ffd54f; --m-adp:#c0913c; --m-amp:#c0913c; --m-nadph:#71abff; --m-glc:#fff1bd;
  --display:"Playfair Display", "Iowan Old Style", Georgia, serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}
#leaders{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;font:500 12px/1.2 var(--body);padding:5px 9px;border-radius:6px;background:rgba(9,17,14,.8);border:1px solid var(--line);color:var(--fg);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);will-change:transform}
.lbl small{display:block;font:400 10.5px/1.3 var(--mono);color:var(--muted);letter-spacing:.02em;margin-top:2px}
.node{pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:7px;font:500 12px/1 var(--body);color:var(--fg);padding:5px 10px 5px 5px;border-radius:999px;background:rgba(9,17,14,.86);border:1px solid var(--nc,var(--line))}
.node b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--nc,#666);color:#0b120e;font:600 11px/1 var(--mono)}
.node:hover{background:rgba(30,44,37,.95)}
.node.on{background:var(--nc);color:#0b120e;box-shadow:0 0 0 4px color-mix(in srgb,var(--nc) 30%,transparent)}
.node.on b{background:#0b120e;color:var(--nc)}
.node:focus-visible,.btn:focus-visible,.tab:focus-visible,.step:focus-visible{outline:2px solid var(--kernel);outline-offset:2px}
.mtag{position:absolute;left:0;top:0;font:500 11px/1 var(--mono);padding:3px 7px;border-radius:999px;border:1px solid currentColor;background:rgba(6,12,10,.82);white-space:nowrap}

.hud{position:fixed;inset:0;z-index:3;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-bottom,0px));
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,352px);grid-template-rows:auto minmax(0,1fr) auto;gap:12px}
.head{grid-column:1;grid-row:1;justify-self:start;pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;flex-direction:column;gap:10px;max-width:100%}
.eyebrow{font:500 10.5px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.eyebrow i{font-style:normal;color:var(--kernel)}
h1{margin:0;font:400 32px/1 var(--display);letter-spacing:-.01em;text-wrap:balance}
h1 em{font-style:italic;color:var(--chloro)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:3px}
.tab{appearance:none;border:0;background:transparent;color:var(--muted);font:500 12.5px/1 var(--body);padding:8px 11px;border-radius:7px;cursor:pointer;display:flex;gap:7px;align-items:center}
.tab span{font:500 10.5px/1 var(--mono);opacity:.75}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{background:var(--kernel);color:var(--kernel-ink)}
.panel{grid-column:2;grid-row:1/4;align-self:start;max-height:100%;overflow:auto;pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 18px 20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;flex-direction:column;gap:14px;scrollbar-width:thin}
.panel h2{margin:0;font:400 26px/1.08 var(--display);text-wrap:balance}
.panel p{margin:0;font-size:13.5px;line-height:1.55;color:#c9d6cb;max-width:62ch}
.panel .note{font-size:12px;color:var(--muted)}
.btn{appearance:none;cursor:pointer;border-radius:9px;font:600 13px/1 var(--body);padding:11px 14px;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:rgba(255,255,255,.08)}
.btn.primary{background:var(--kernel);color:var(--kernel-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.ctrl{display:grid;gap:10px}
.ctrl label{display:grid;grid-template-columns:96px minmax(0,1fr) 40px;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.ctrl output{font:500 11px/1 var(--mono);color:var(--fg);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--kernel)}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.checks label{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:7px 9px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);cursor:pointer}
.checks input{accent-color:var(--kernel);margin:0}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
dl.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;margin:0;font-size:12.5px;border-top:1px solid var(--line);padding-top:12px}
dl.facts dt{color:var(--muted)}
dl.facts dd{margin:0;color:var(--fg)}
.card{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:12px 13px;display:grid;gap:7px}
.card h3{margin:0;font:600 14px/1.3 var(--body)}
.card .where{font:500 10.5px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--kernel)}
.eq{font:500 12.5px/1.5 var(--mono);background:rgba(0,0,0,.28);border-radius:7px;padding:8px 10px;color:#f3f1e4;overflow-x:auto;white-space:nowrap}
.enz{font-size:12px;color:var(--muted)}
.enz strong{color:var(--fg);font-weight:500}
.steps{display:grid;gap:4px;list-style:none;margin:0;padding:0}
.step{appearance:none;width:100%;text-align:left;cursor:pointer;display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 9px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--fg);font:500 12.5px/1.3 var(--body)}
.step b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;font:600 11px/1 var(--mono);background:var(--sc);color:#0b120e}
.step em{font:400 10.5px/1 var(--mono);color:var(--muted);font-style:normal}
.step:hover{background:var(--panel-2)}
.step.on{border-color:var(--sc);background:color-mix(in srgb,var(--sc) 12%,transparent)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font:400 11.5px/1.2 var(--mono);color:#cbd6cc}
.legend span{display:flex;align-items:center;gap:7px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
table.budget{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
table.budget th,table.budget td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
table.budget th:first-child,table.budget td:first-child{text-align:left;color:var(--muted);font-weight:400}
table.budget th{font:500 10.5px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sec{font:500 10.5px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.hint{grid-column:1;grid-row:3;justify-self:start;align-self:end;font:400 11.5px/1.3 var(--mono);color:#dfe8db;background:rgba(9,17,14,.62);border:1px solid var(--line);border-radius:999px;padding:7px 12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#fade{position:fixed;inset:0;z-index:5;pointer-events:none;opacity:0;transition:opacity .45s ease;background:radial-gradient(120% 90% at 50% 50%,#2c5a2a 0%,#0f2618 55%,#08120e 100%);display:grid;place-items:center}
#fade.on{opacity:1}
#fade p{font:italic 400 26px/1.2 var(--display);color:#dfeccf;margin:0}
#err{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;z-index:9}
@media (max-width:759px){
  .hud{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:8px}
  .head{padding:10px 12px;gap:8px;justify-self:stretch}
  h1{font-size:24px}
  .tab{padding:7px 9px;font-size:12px}
  .panel{grid-column:1;grid-row:3;max-height:44vh;padding:14px 14px 16px;gap:12px}
  .panel h2{font-size:22px}
  .hint{display:none}
  .lbl{font-size:11px;padding:4px 7px}
  .lbl small{display:none}
  .node{font-size:11px;padding:4px 8px 4px 4px}
  .node b{width:18px;height:18px}
}
@media (prefers-reduced-motion:reduce){#fade{transition:none}}
</style>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>

<body>
<canvas id="stage" tabindex="0" aria-label="Mô hình 3D cây ngô và lát cắt ngang lá"></canvas>
<div id="labels"><svg id="leaders" aria-hidden="true"></svg></div>
<div id="fade"><p id="fadeText">Đang cắt lát ngang…</p></div>

<div class="hud">
  <header class="head">
    <div class="eyebrow"><i>Zea mays</i> · C4 kiểu NADP-ME</div>
    <h1>Khám phá ngô <em>C4</em></h1>
    <nav class="tabs" role="tablist" aria-label="Mức phóng to">
      <button class="tab" role="tab" data-mode="plant" aria-selected="true"><span>1</span>Cây</button>
      <button class="tab" role="tab" data-mode="kranz" aria-selected="false"><span>2</span>Giải phẫu Kranz</button>
      <button class="tab" role="tab" data-mode="pathway" aria-selected="false"><span>3</span>Con đường C4</button>
    </nav>
  </header>
  <aside class="panel" id="panel" aria-live="polite"></aside>
  <div class="hint" id="hint">Kéo để xoay · cuộn hoặc chụm để phóng to</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
"use strict";
if(!window.THREE || !THREE.OrbitControls){
  document.body.insertAdjacentHTML('beforeend','<div id="err"><p>Không tải được thư viện 3D. Hãy kiểm tra kết nối mạng và tải lại trang.</p></div>');
  return;
}
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const canvas = document.getElementById('stage');
let renderer;
try{ renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'}); }
catch(e){ document.body.insertAdjacentHTML('beforeend','<div id="err"><p>Trình duyệt này không khởi động được WebGL mà mô hình 3D cần.</p></div>'); return; }
const PR = Math.min(devicePixelRatio||1, 2);
renderer.setPixelRatio(PR);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const lin = h => new THREE.Color(h).convertSRGBToLinear();
const V3 = (x,y,z)=>new THREE.Vector3(x,y,z);
const camera = new THREE.PerspectiveCamera(42, 1, 0.01, 420);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.rotateSpeed = 0.7;

const plantScene = new THREE.Scene();
const cellScene = new THREE.Scene();
let activeScene = plantScene;

/* ================= LAYER 1: PLANT ================= */
const SUN = new THREE.Vector3();
const sunCol = new THREE.Color();
const skyU = { zen:new THREE.Color(), hor:new THREE.Color() };
const fogCol = new THREE.Color(0.62,0.62,0.58);
plantScene.fog = new THREE.Fog(fogCol, 26, 120);

const leafUniforms = {
  uTime:{value:0}, uWind:{value:1}, uSunDir:{value:SUN}, uSunCol:{value:sunCol},
  uSky:{value:new THREE.Color(0.34,0.46,0.66)}, uGround:{value:new THREE.Color(0.16,0.12,0.07)},
  uFogColor:{value:fogCol}, uFogNear:{value:26}, uFogFar:{value:120}
};
const leafVS = `
attribute float aPhase;
uniform float uTime; uniform float uWind;
varying vec3 vN; varying vec3 vW; varying vec2 vUv; varying float vDist;
void main(){
  float ph = aPhase;
  vec4 wp; vec3 n = normal;
  #ifdef USE_INSTANCING
    wp = modelMatrix * instanceMatrix * vec4(position,1.0);
    n = mat3(instanceMatrix) * n;
    ph += instanceMatrix[3].x*0.71 + instanceMatrix[3].z*0.37;
  #else
    wp = modelMatrix * vec4(position,1.0);
  #endif
  float s = uv.x;
  float gust = 0.65 + 0.35*sin(uTime*0.37 + wp.x*0.05);
  float sway = sin(uTime*1.25 + ph + s*2.4)*0.62 + sin(uTime*2.7 + ph*1.7 + s*4.8)*0.24;
  float flutter = sin(uTime*7.5 + ph*3.1 + s*13.0 + uv.y*2.5);
  float amp = uWind * gust * s * s;
  wp.x += (sway*0.20 + flutter*0.012) * amp;
  wp.z += (sway*0.07) * amp;
  wp.y += (flutter*0.03 - abs(sway)*0.06) * amp;
  vN = normalize(mat3(modelMatrix) * n);
  vW = wp.xyz; vUv = uv;
  vec4 mv = viewMatrix * wp;
  vDist = -mv.z;
  gl_Position = projectionMatrix * mv;
}`;
const leafFS = `
uniform vec3 uSunDir; uniform vec3 uSunCol; uniform vec3 uSky; uniform vec3 uGround;
uniform vec3 uFogColor; uniform float uFogNear; uniform float uFogFar;
varying vec3 vN; varying vec3 vW; varying vec2 vUv; varying float vDist;
void main(){
  vec3 N = normalize(vN);
  if(!gl_FrontFacing) N = -N;
  vec3 V = normalize(cameraPosition - vW);
  vec3 L = normalize(uSunDir);
  float s = vUv.x; float v = vUv.y;
  vec3 base = mix(vec3(0.035,0.11,0.02), vec3(0.11,0.25,0.045), smoothstep(0.0,0.85,s));
  base = mix(base, vec3(0.30,0.27,0.10), smoothstep(0.90,1.0,s)*0.55);
  float rib = 1.0 - smoothstep(0.03,0.10,abs(v));
  base = mix(base, vec3(0.30,0.40,0.16), rib*0.75);
  float veins = 0.5 + 0.5*sin(abs(v)*72.0);
  base *= 0.88 + 0.12*veins;
  float ndl = dot(N,L);
  float wrap = max((ndl + 0.4)/1.4, 0.0);
  float hemi = N.y*0.5 + 0.5;
  vec3 amb = mix(uGround, uSky, hemi) * 0.6;
  float back = clamp(-ndl, 0.0, 1.0);
  float through = pow(max(dot(V,-L),0.0), 2.2);
  vec3 sss = vec3(0.30,0.55,0.06) * (through*(0.35+0.65*back) + back*0.22) * (0.75+0.25*veins) * (1.0-rib*0.5);
  vec3 H = normalize(L+V);
  float spec = pow(max(dot(N,H),0.0), 36.0) * 0.22 * step(0.0, ndl);
  vec3 col = base*(amb + uSunCol*wrap*0.85) + sss*uSunCol*1.25 + spec*uSunCol;
  float f = smoothstep(uFogNear, uFogFar, vDist);
  col = mix(col, uFogColor, f);
  gl_FragColor = vec4(col, 1.0);
  #include <tonemapping_fragment>
  #include <encodings_fragment>
}`;
const leafMat = new THREE.ShaderMaterial({uniforms:leafUniforms, vertexShader:leafVS, fragmentShader:leafFS, side:THREE.DoubleSide});
const fieldLeafMat = new THREE.ShaderMaterial({uniforms:leafUniforms, vertexShader:leafVS, fragmentShader:leafFS, side:THREE.DoubleSide});

function leafGeo(L, W, droop, phase, segs, across){
  const pos=[], uv=[], ph=[], idx=[];
  for(let i=0;i<=segs;i++){
    const s=i/segs;
    const cx=L*0.92*s, cy=L*(0.5*s - droop*s*s);
    const dx=L*0.92, dy=L*(0.5-2*droop*s); const tl=Math.hypot(dx,dy);
    const tx=dx/tl, ty=dy/tl, nx=-ty, ny=tx;
    let w = W*Math.pow(Math.sin(Math.PI*Math.min(1,0.1+s*0.92)),0.75);
    if(s<0.08) w *= 0.55 + (s/0.08)*0.45;
    const tw = s*0.55*Math.sin(phase*2.3);
    const ct=Math.cos(tw), st=Math.sin(tw);
    for(let j=0;j<=across;j++){
      const v=-1+2*j/across;
      const lat=v*w*0.5;
      const fold=Math.abs(v)*w*0.17;
      const wave = s>0.15 ? Math.sin(s*58+phase*3+(v>0?0:1.7))*0.02*v*v*Math.min(1,(s-0.15)*4) : 0;
      const off=fold+wave;
      pos.push(cx+nx*off+nx*lat*st, cy+ny*off+ny*lat*st, lat*ct);
      uv.push(s, v); ph.push(phase);
    }
  }
  for(let i=0;i<segs;i++) for(let j=0;j<across;j++){
    const a=i*(across+1)+j, b=a+across+1;
    idx.push(a,b,a+1, b,b+1,a+1);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
  g.setAttribute('aPhase', new THREE.Float32BufferAttribute(ph,1));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
function mergeGeos(geos){
  let vc=0, ic=0; geos.forEach(g=>{vc+=g.attributes.position.count; ic+=g.index.count;});
  const P=new Float32Array(vc*3), N=new Float32Array(vc*3), U=new Float32Array(vc*2), A=new Float32Array(vc), I=new Uint32Array(ic);
  let vo=0, io=0;
  geos.forEach(g=>{
    P.set(g.attributes.position.array, vo*3); N.set(g.attributes.normal.array, vo*3);
    U.set(g.attributes.uv.array, vo*2); A.set(g.attributes.aPhase.array, vo);
    const ix=g.index.array; for(let k=0;k<ix.length;k++) I[io+k]=ix[k]+vo;
    vo+=g.attributes.position.count; io+=ix.length;
  });
  const m=new THREE.BufferGeometry();
  m.setAttribute('position',new THREE.BufferAttribute(P,3)); m.setAttribute('normal',new THREE.BufferAttribute(N,3));
  m.setAttribute('uv',new THREE.BufferAttribute(U,2)); m.setAttribute('aPhase',new THREE.BufferAttribute(A,1));
  m.setIndex(new THREE.BufferAttribute(I,1));
  return m;
}

// Sky dome
const skyMat = new THREE.ShaderMaterial({
  uniforms:{uSun:{value:SUN}, uZen:{value:skyU.zen}, uHor:{value:skyU.hor}, uSunCol:{value:sunCol}},
  vertexShader:`varying vec3 vD; void main(){ vD=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
  fragmentShader:`uniform vec3 uSun; uniform vec3 uZen; uniform vec3 uHor; uniform vec3 uSunCol; varying vec3 vD;
  void main(){ vec3 d=normalize(vD); float h=clamp(d.y,0.0,1.0);
    vec3 c=mix(uHor,uZen,pow(h,0.55));
    float s=max(dot(d,normalize(uSun)),0.0);
    c += uSunCol*(pow(s,900.0)*5.0 + pow(s,14.0)*0.28 + pow(s,3.0)*0.06);
    if(d.y<0.0) c=uHor*0.85;
    gl_FragColor=vec4(c,1.0);
    #include <tonemapping_fragment>
    #include <encodings_fragment>
  }`, side:THREE.BackSide, depthWrite:false, fog:false
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(300,32,16), skyMat);
plantScene.add(sky);

const hemi = new THREE.HemisphereLight(0xa9c8ff, 0x4a3a22, 0.75);
plantScene.add(hemi);
const sunLight = new THREE.DirectionalLight(0xffffff, 2.2);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048,2048);

function makeEar(scale){
  const ear=new THREE.Group();
  const prof=t=>Math.pow(Math.sin(Math.PI*Math.min(1,t*1.12+0.06)),0.55);
  const huskPts=[], cobPts=[];
  for(let i=0;i<=24;i++){ const t=i/24; huskPts.push(new THREE.Vector2(0.105*prof(t)+0.004,t*0.98)); cobPts.push(new THREE.Vector2(0.078*prof(t*0.98),t*0.9)); }
  const gap=1.1, phiLen=Math.PI*2-gap;
  const husk=new THREE.Mesh(new THREE.LatheGeometry(huskPts,40,0,phiLen),new THREE.MeshStandardMaterial({color:lin('#93b25a'),roughness:.6,side:THREE.DoubleSide}));
  husk.rotation.y=Math.PI/2-(phiLen+gap/2);
  husk.castShadow=true; ear.add(husk);
  const cob=new THREE.Mesh(new THREE.LatheGeometry(cobPts,24),new THREE.MeshStandardMaterial({color:lin('#c99a3a'),roughness:.7}));
  ear.add(cob);
  const rows=16, per=26, kg=new THREE.SphereGeometry(1,8,6);
  const kernels=new THREE.InstancedMesh(kg,new THREE.MeshStandardMaterial({roughness:.35}),rows*per);
  const d=new THREE.Object3D(), c=new THREE.Color(); let n=0;
  for(let r=0;r<rows;r++) for(let i=0;i<per;i++){
    const t=0.08+i/(per-1)*0.8, a=r/rows*Math.PI*2+(i%2)*0.09, rad=0.078*prof(t*0.98)+0.006;
    d.position.set(Math.sin(a)*rad,t*0.9,Math.cos(a)*rad);
    d.lookAt(Math.sin(a)*rad*3,t*0.9,Math.cos(a)*rad*3);
    const sz=0.6+0.4*Math.sin(Math.PI*Math.min(1,t*1.1));
    d.scale.set(0.017*sz,0.021*sz,0.012); d.updateMatrix(); kernels.setMatrixAt(n,d.matrix);
    c.setHSL(0.115+Math.random()*0.02,0.85,0.5+Math.random()*0.08).convertSRGBToLinear(); kernels.setColorAt(n,c); n++;
  }
  ear.add(kernels);
  const sp=[];
  for(let i=0;i<46;i++){
    const a=Math.random()*Math.PI*2, out=0.2+Math.random()*0.22;
    let px=0,py=0.97,pz=0;
    for(let s=0;s<8;s++){ const nx=px+Math.sin(a)*out/8, nz=pz+Math.cos(a)*out/8, ny=py+0.03-s*s*0.006; sp.push(px,py,pz,nx,ny,nz); px=nx;py=ny;pz=nz; }
  }
  const sg=new THREE.BufferGeometry(); sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
  ear.add(new THREE.LineSegments(sg,new THREE.LineBasicMaterial({color:lin('#d4b26c')})));
  ear.scale.setScalar(scale);
  return ear;
}

function setSun(elevDeg){
  const el=elevDeg*Math.PI/180, az=-2.35;
  SUN.set(Math.cos(el)*Math.sin(az),Math.sin(el),Math.cos(el)*Math.cos(az)).normalize();
  const k=Math.min(1,Math.max(0,(elevDeg-6)/60));
  const warm=new THREE.Color(1.0,0.55,0.28), white=new THREE.Color(1.0,0.93,0.82);
  sunCol.copy(warm).lerp(white,k).multiplyScalar(2.0+0.6*k);
  skyU.zen.setRGB(0.10+0.08*k,0.20+0.16*k,0.42+0.22*k);
  skyU.hor.copy(new THREE.Color(0.95,0.62,0.40)).lerp(new THREE.Color(0.70,0.78,0.86),k);
  fogCol.copy(skyU.hor).multiplyScalar(0.85);
  leafUniforms.uSky.value.copy(skyU.zen).lerp(skyU.hor,0.4);
  sunLight.color.copy(sunCol).multiplyScalar(1/2.2);
  sunLight.intensity=1.6+1.0*k;
  sunLight.position.copy(SUN).multiplyScalar(25).add(sunLight.target.position);
  hemi.intensity=0.45+0.4*k;
}

function leafPointWorld(mesh, s){
  mesh.updateWorldMatrix(true,false);
  const g=mesh.geometry, segs=34, across=6, i=Math.round(s*segs), j=across/2+1;
  const idx=i*(across+1)+j;
  const p=V3(g.attributes.position.getX(idx),g.attributes.position.getY(idx),g.attributes.position.getZ(idx)).applyMatrix4(mesh.matrixWorld);
  const n=V3(g.attributes.normal.getX(idx),g.attributes.normal.getY(idx),g.attributes.normal.getZ(idx)).transformDirection(mesh.matrixWorld);
  if(n.dot(camera.position.clone().sub(p))<0) n.negate();
  return {point:p, normal:n};
}

const MAXP=1400;
const pPos=new Float32Array(MAXP*3), pCol=new Float32Array(MAXP*3), pSize=new Float32Array(MAXP), pAlpha=new Float32Array(MAXP);

const pMat=new THREE.ShaderMaterial({
  uniforms:{uScale:{value:400}},
  vertexShader:`attribute vec3 aColor; attribute float aSize; attribute float aAlpha; uniform float uScale; varying vec3 vC; varying float vA;
    void main(){ vec4 mv=modelViewMatrix*vec4(position,1.0); gl_Position=projectionMatrix*mv; gl_PointSize=clamp(aSize*uScale/(-mv.z),1.0,64.0); vC=aColor; vA=aAlpha; }`,
  fragmentShader:`varying vec3 vC; varying float vA;
    void main(){ vec2 d=gl_PointCoord-0.5; float r=length(d)*2.0; if(r>1.0) discard;
      float glow=exp(-r*r*3.5); float core=smoothstep(0.42,0.0,r);
      gl_FragColor=vec4(vC*glow*1.15 + vec3(1.0)*core*0.55, vA*(glow*0.95+core*0.35)); }`,
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending
});
const points=new THREE.Points(pGeo,pMat); points.frustumCulled=false; PW.add(points);
const pool=Array.from({length:MAXP},()=>({on:false}));
const tags=[];
function spawn(pathKey,mol,o){
  const p=pool.find(q=>!q.on); if(!p) return null;
  const path=PATHS[pathKey];
  Object.assign(p,{on:true,path,t:0,lap:0,delay:o.delay||0,dur:o.dur||Math.min(3.4,Math.max(0.9,path.len/0.32)),
    col:MOL[mol].c,size:o.size||0.03,alpha:o.alpha==null?1:o.alpha,loops:o.loops||0,closed:pathKey==='calvin',
    ox:(Math.random()-.5)*0.028,oy:(Math.random()-.5)*0.028,tag:null});
  return p;
}
function burst(pathKey,mol,n,delay,loops,withTag){
  for(let k=0;k<n;k++){
    const p=spawn(pathKey,mol,{delay:delay+k*0.14,size:0.034,loops:loops||0});
    if(p && k===0 && withTag){
      const el=document.createElement('div'); el.className='mtag'; el.textContent=MOL[mol].name; el.style.color=MOL[mol].hex; el.hidden=true;
      labelLayer.appendChild(el); p.tag=el; tags.push(p);
    }
  }
}
const tmpV=new THREE.Vector3();
function updateParticles(dt){
  for(let i=0;i<MAXP;i++){
    const p=pool[i];
    if(!p.on){ pAlpha[i]=0; continue; }
    if(p.delay>0){ p.delay-=dt; pAlpha[i]=0; continue; }
    p.t+=dt/p.dur;
    if(p.t>=1){ if(p.loops>0){ p.t-=1; p.loops--; p.lap++; } else { p.on=false; pAlpha[i]=0; if(p.tag){ p.tag.remove(); p.tag=null; } continue; } }
    p.path.c.getPointAt(p.t,tmpV);
    const env=p.closed?1:Math.sin(Math.PI*p.t);
    pPos[i*3]=tmpV.x+p.ox*env; pPos[i*3+1]=tmpV.y+p.oy*env; pPos[i*3+2]=tmpV.z;
    pCol[i*3]=p.col.r; pCol[i*3+1]=p.col.g; pCol[i*3+2]=p.col.b;
    pSize[i]=p.size;
    let a=p.alpha;
    if(p.lap===0) a*=Math.min(1,p.t*7);
    if(p.loops===0) a*=Math.min(1,(1-p.t)*7);
    pAlpha[i]=a;
    if(p.tag) p.tag._pos=V3(pPos[i*3],pPos[i*3+1],pPos[i*3+2]);
  }
  pGeo.attributes.position.needsUpdate=true; pGeo.attributes.aColor.needsUpdate=true;
  pGeo.attributes.aSize.needsUpdate=true; pGeo.attributes.aAlpha.needsUpdate=true;
}

function ambient(dt){
  ambT+=dt; if(ambT<0.16) return; ambT=0;

  spawn(k,m,{size:0.022,alpha:0.5,loops:k==='calvin'?1:0});
}

let VW=innerWidth, VH=innerHeight;
function updateLabels(){
  const scale = VW<600?0.55:(VW<900?0.8:1);
  const sceneKey = activeScene===plantScene?'plant':'cell';
  labels.forEach(L=>{
    const inMode = L.modes.includes(mode) && !transitioning && (sceneKey==='plant')===(mode==='plant');
    if(!inMode){ if(!L.el.hidden){ L.el.hidden=true; L.line.setAttribute('visibility','hidden'); L.dot.setAttribute('visibility','hidden'); } return; }
    L.anchor.getWorldPosition(tmpV); tmpV.project(camera);
    if(tmpV.z>1 || Math.abs(tmpV.x)>1.3 || Math.abs(tmpV.y)>1.3){ L.el.hidden=true; L.line.setAttribute('visibility','hidden'); L.dot.setAttribute('visibility','hidden'); return; }
    const x=(tmpV.x*0.5+0.5)*VW, y=(-tmpV.y*0.5+0.5)*VH;
    const lx=x+L.off[0]*scale, ly=y+L.off[1]*scale;
    L.el.hidden=false;
    L.el.style.transform=`translate(${lx}px,${ly}px) translate(-50%,-50%)`;
    L.line.setAttribute('visibility','visible'); L.dot.setAttribute('visibility','visible');
    L.line.setAttribute('x1',x); L.line.setAttribute('y1',y); L.line.setAttribute('x2',lx); L.line.setAttribute('y2',ly);
    L.dot.setAttribute('cx',x); L.dot.setAttribute('cy',y);
  });
  for(let i=tags.length-1;i>=0;i--){
    const p=tags[i];
    if(!p.tag){ tags.splice(i,1); continue; }
    if(!p._pos && !p.tag._pos){ continue; }
    if(mode!=='pathway' || p.delay>0 || !p.tag._pos){ p.tag.hidden=true; continue; }
    tmpV.copy(p.tag._pos).project(camera);
    const x=(tmpV.x*0.5+0.5)*VW, y=(-tmpV.y*0.5+0.5)*VH;
    p.tag.hidden=false; p.tag.style.transform=`translate(${x+10}px,${y-14}px)`;
  }
}

const panel=document.getElementById('panel');
let eff={w:innerWidth,h:innerHeight};
function layout(){
  VW=innerWidth; VH=innerHeight;
  renderer.setSize(VW,VH,false);
  camera.aspect=VW/VH;
  const r=panel.getBoundingClientRect();
  if(VW>=760){ eff={w:Math.max(200,r.left-12),h:VH}; camera.setViewOffset(VW,VH,(VW-eff.w)/2,0,VW,VH); }
  else { eff={w:VW,h:Math.max(200,r.top-8)}; camera.setViewOffset(VW,VH,0,(VH-eff.h)/2,VW,VH); }
  camera.updateProjectionMatrix();
  pMat.uniforms.uScale.value = VH*PR/(2*Math.tan(camera.fov*Math.PI/360));
}
function fitDist(w,h){ const vh=2*Math.tan(camera.fov*Math.PI/360); return Math.max(h*VH/(vh*eff.h), w*VH/(vh*eff.w)); }

  pathway:()=>{ const t=V3(1.2,-0.78,0), d=V3(0.07,-0.06,1).normalize(); return {t, p:t.clone().add(d.multiplyScalar(fitDist(1.75,1.55)))}; }
};
let tween=null;
const ease=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
function flyTo(p,t,dur){
  return new Promise(res=>{ tween={p0:camera.position.clone(),t0:controls.target.clone(),p1:p.clone(),t1:t.clone(),s:performance.now(),d:reduce?60:(dur||1.6)*1000,res}; controls.enabled=false; });
}
function stepTween(){
  if(!tween) return;
  const k=Math.min(1,(performance.now()-tween.s)/tween.d), e=ease(k);
  camera.position.lerpVectors(tween.p0,tween.p1,e); controls.target.lerpVectors(tween.t0,tween.t1,e); camera.lookAt(controls.target);
  if(k>=1){ const r=tween.res; tween=null; controls.enabled=true; r(); }
}
const fadeEl=document.getElementById('fade'), fadeText=document.getElementById('fadeText');
const wait=ms=>new Promise(r=>setTimeout(r,reduce?0:ms));
async function fade(on,text){ if(text) fadeText.textContent=text; fadeEl.classList.toggle('on',on); await wait(470); }
function setControlsFor(m){
  if(m==='plant'){ controls.minDistance=0.5; controls.maxDistance=34; controls.maxPolarAngle=1.5; }
  else { controls.minDistance=0.35; controls.maxDistance=40; controls.maxPolarAngle=Math.PI; }
}

let mode='plant', transitioning=false, explode=0, explodeTarget=0, dim=1, dimTarget=1;
let lastLeafHit=null;
async function go(next,opts={}){
  if(transitioning || next===mode) return;
  transitioning=true; stopPlay();
  setTabs(next);
  if(mode==='plant'){
    const hit=opts.hit||leafPointWorld(heroLeaves[5],0.55);
    lastLeafHit=hit;
    await flyTo(hit.point.clone().add(hit.normal.clone().multiplyScalar(0.22)),hit.point,1.35);
    await fade(true,'Đang cắt lát ngang…');
    activeScene=cellScene; mode=next; renderPanel(); layout(); applyMode();
    camera.position.set(10,15,36); controls.target.set(0,0,-1.6); camera.lookAt(controls.target);
    await fade(false);
    const v=VIEWS.kranz(); await flyTo(v.p,v.t,2.0);
    if(next==='pathway'){ const v2=VIEWS.pathway(); await flyTo(v2.p,v2.t,1.6); }
  } else if(next==='plant'){
    const v=VIEWS.kranz(); await flyTo(v.p.clone().multiplyScalar(2.2),v.t,1.0);
    await fade(true,'Quay lại cánh đồng…');
    activeScene=plantScene; mode=next; renderPanel(); layout(); applyMode();
    const hit=lastLeafHit||leafPointWorld(heroLeaves[5],0.55);
    camera.position.copy(hit.point.clone().add(hit.normal.clone().multiplyScalar(0.3))); controls.target.copy(hit.point); camera.lookAt(hit.point);
    await fade(false);
    const vp=VIEWS.plant(); await flyTo(vp.p,vp.t,1.8);
  } else {
    mode=next; renderPanel(); layout(); applyMode();
    const v=VIEWS[next](); await flyTo(v.p,v.t,1.5);
  }
  transitioning=false;
  if(mode==='pathway' && activeStep<0) runStep(0);
}
function applyMode(){
  setControlsFor(mode);
  PW.visible = mode==='pathway';
  explodeTarget = mode==='kranz' ? explodeSetting : 0;
  dimTarget = mode==='pathway' ? 0.32 : 1;
  focusRings.forEach(r=>r.material.opacity=0);
  if(mode==='pathway'){ [gEpi,gMeso,gBS,gVasc].forEach(g=>g.visible=true); }
  else if(mode==='kranz'){ gEpi.visible=layerVis.epi; gMeso.visible=layerVis.meso; gBS.visible=layerVis.bs; gVasc.visible=layerVis.vasc; }
  document.getElementById('hint').textContent = mode==='plant' ? 'Kéo để xoay · bấm vào lá để cắt lát' : mode==='kranz' ? 'Kéo để xoay · bấm vào tế bào để xem tên' : 'Bấm vào nút có số để chạy phản ứng đó';
}
function setTabs(m){ document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.mode===m))); }
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>go(t.dataset.mode)));

/* ================= PANEL ================= */
let explodeSetting=0, windSetting=1, selectedTissue=null, activeStep=-1, playing=false, playTimer=null;
const layerVis={epi:true,meso:true,bs:true,vasc:true};
const TISSUE={
  mesophyll:['Tế bào mô giậu','Vòng ngoài','Các tế bào xếp thưa, tỏa tròn quanh mỗi bao bó mạch. Ở ngô, chúng chứa PEP carboxylase trong tế bào chất và lục lạp nhiều grana, nhưng hầu như không có Rubisco. Không tế bào mô giậu nào cách bao bó mạch quá khoảng hai tế bào.'],
  bundle:['Tế bào bao bó mạch','Vòng trong','Tế bào lớn, thành dày, bao quanh mỗi gân lá. Lục lạp tập trung về phía thành ngoài và ở ngô gần như không có grana, vì NADPH đến từ malat chứ không từ hệ quang hóa II. Rubisco và chu trình Calvin hoạt động ở đây.'],
  xylem:['Mạch gỗ','Bó mạch, phía trên','Các ống chết, hóa gỗ (lignin), dẫn nước và khoáng từ rễ lên. Nằm ở phía trên (mặt bụng) của mỗi bó mạch.'],
  phloem:['Mạch rây','Bó mạch, phía dưới','Ống rây và tế bào kèm ở phía dưới (mặt lưng). Chúng nhận đường tạo ra ở lá và vận chuyển đến bắp, thân và rễ.'],
  parenchyma:['Nhu mô mạch','Bên trong bó mạch','Các tế bào sống lấp đầy giữa mạch gỗ và mạch rây, giúp chuyển chất tan vào các tế bào dẫn.'],
  epidermis:['Biểu bì','Lớp ngoài cùng','Một lớp tế bào phủ lớp cutin sáp giúp hạn chế mất nước.'],
  bulliform:['Tế bào vận động (bulliform)','Biểu bì trên','Tế bào lớn, thành mỏng nằm giữa các gân. Khi mất nước, lá cuộn vào trong – phản ứng của cây họ lúa với hạn và nóng.'],
  stoma:['Khí khổng','Biểu bì dưới','Lỗ giữa hai tế bào hạt đậu hình quả tạ, hai bên có tế bào phụ, giống mọi cây họ lúa. CO₂ đi vào khoang dưới khí khổng qua đây.']
};
function legendHTML(){ return ['co2','pep','oaa','mal','pyr','atp','adp','amp','nadph','glc'].map(k=>`<span><i class="dot" style="background:${MOL[k].hex};color:${MOL[k].hex}"></i>${MOL[k].name}</span>`).join(''); }
function renderPanel(){
  if(mode==='plant'){
    panel.innerHTML=`
      <div class="eyebrow">Lớp 1 · Toàn cây</div>
      <h2>Cây C4 họ lúa ngoài đồng</h2>
      <p>Ngô cố định cacbon hai lần. Một “bơm” ở các tế bào vòng ngoài dồn CO₂ vào vòng tế bào bên trong, nhờ đó Rubisco vẫn hoạt động ở nồng độ CO₂ cao ngay cả khi khí khổng khép bớt lúc trời nóng.</p>
      <div class="row"><button class="btn primary" data-act="cut">Cắt lát lá</button></div>
      <p class="note">Hoặc bấm vào một lá bất kỳ trên cây để phóng to.</p>
      <div class="ctrl">
        <label for="wind">Gió<input id="wind" type="range" min="0" max="2" step="0.05" value="${windSetting}"><output id="windO">${windSetting.toFixed(2)}</output></label>
        <label for="sun">Độ cao mặt trời<input id="sun" type="range" min="6" max="70" step="1" value="${sunElev}"><output id="sunO">${sunElev}°</output></label>
      </div>
      <p class="note">Hạ thấp mặt trời để thấy ánh sáng xuyên qua phiến lá. Vầng sáng xanh lục là phần ánh sáng mà diệp lục không hấp thụ.</p>
      <dl class="facts">
        <dt>Con đường</dt><dd>C4, kiểu enzyme NADP-malic</dd>
        <dt>Gân lá</dt><dd>Song song, xếp sát nhau</dd>
        <dt>Cách mọc lá</dt><dd>Mọc cách, xếp thành hai dãy</dd>
        <dt>Hoa</dt><dd>Bông cờ (đực) ở ngọn, bắp (cái) ở các đốt</dd>
      </dl>`;
  } else if(mode==='kranz'){
    const t=selectedTissue&&TISSUE[selectedTissue];
    panel.innerHTML=`
      <div class="eyebrow">Lớp 2 · Giải phẫu Kranz</div>
      <h2>Hai vòng tế bào quanh mỗi gân lá</h2>
      <p><em>Kranz</em> trong tiếng Đức nghĩa là “vòng hoa”. Tế bào bao bó mạch tạo vòng trong quanh mỗi gân lá, tế bào mô giậu tỏa tròn bên ngoài. Hai loại tế bào chia nhau thực hiện quang hợp.</p>
      ${t?`<div class="card"><div class="where">${t[1]}</div><h3>${t[0]}</h3><p>${t[2]}</p></div>`:`<div class="card"><h3>Nhận biết tế bào</h3><p>Bấm vào một tế bào bất kỳ trên lát cắt để xem chức năng.</p></div>`}
      <div class="sec">Các lớp mô</div>
      <div class="checks">
        <label><input type="checkbox" data-layer="epi" ${layerVis.epi?'checked':''}><i class="sw" style="background:#a7c98b"></i>Biểu bì</label>
        <label><input type="checkbox" data-layer="meso" ${layerVis.meso?'checked':''}><i class="sw" style="background:#7fbf5f"></i>Mô giậu</label>
        <label><input type="checkbox" data-layer="bs" ${layerVis.bs?'checked':''}><i class="sw" style="background:#4f8f3d"></i>Bao bó mạch</label>
        <label><input type="checkbox" data-layer="vasc" ${layerVis.vasc?'checked':''}><i class="sw" style="background:#cf9271"></i>Bó mạch</label>
      </div>
      <div class="ctrl"><label for="explode">Tách lớp<input id="explode" type="range" min="0" max="1" step="0.01" value="${explodeSetting}"><output id="explodeO">${Math.round(explodeSetting*100)}%</output></label></div>
      <div class="row"><button class="btn primary" data-act="trace">Theo dõi con đường C4</button><button class="btn" data-act="plant">Quay lại cây</button></div>
      <p class="note">Mô hình là một khối lá cắt ngang qua bốn gân. Tế bào kéo dài dọc theo lá nên mỗi tế bào là một cột.</p>`;
  } else {
    const s=STEPS[activeStep];
    panel.innerHTML=`
      <div class="eyebrow">Lớp 3 · Dòng sinh hóa</div>
      <h2>Vòng cố định CO₂ hai giai đoạn</h2>
      <p>Bấm vào nút có số trong mô hình hoặc một bước bên dưới. Các hạt sáng thể hiện từng phân tử di chuyển giữa hai loại tế bào.</p>
      <div class="row"><button class="btn primary" data-act="play">${playing?'Dừng':'Chạy cả chu trình'}</button><button class="btn" data-act="kranz">Quay lại giải phẫu</button></div>
      <ol class="steps">${STEPS.map((x,i)=>`<li><button class="step ${i===activeStep?'on':''}" data-step="${i}" style="--sc:${x.color}"><b>${x.n}</b>${x.title}<em>${x.zone||x.where}</em></button></li>`).join('')}</ol>
      ${s?`<div class="card"><div class="where">${s.where}</div><h3>${s.title}</h3><div class="eq">${s.eq}</div><div class="enz">Enzyme: <strong>${s.enzyme}</strong></div><p>${s.text}</p></div>`:''}
      <div class="sec">Phân tử</div>
      <div class="legend">${legendHTML()}</div>
      <div class="sec">Năng lượng tiêu tốn cho mỗi CO₂ cố định</div>
      <table class="budget"><thead><tr><th></th><th>ATP</th><th>NADPH</th></tr></thead>
        <tbody><tr><td>Cây C3</td><td>3</td><td>2</td></tr><tr><td>Ngô (C4)</td><td>5</td><td>2</td></tr><tr><td>Mỗi glucose, C4</td><td>30</td><td>12</td></tr></tbody></table>
      <p class="note">Hai ATP thêm vào là chi phí cho PPDK. Đổi lại, Rubisco hầu như không gắn O₂, giúp tiết kiệm nhiều hơn hẳn trong điều kiện nóng, nắng gắt.</p>`;
  }
}
panel.addEventListener('click',e=>{
  const b=e.target.closest('[data-act],[data-step]'); if(!b) return;
  if(b.dataset.step!=null){ stopPlay(); runStep(+b.dataset.step); return; }
  const a=b.dataset.act;
  if(a==='cut') go('kranz');
  else if(a==='trace') go('pathway');
  else if(a==='plant') go('plant');
  else if(a==='kranz') go('kranz');
  else if(a==='play'){ playing?stopPlay():startPlay(); }
});
panel.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='wind'){ windSetting=+t.value; document.getElementById('windO').textContent=windSetting.toFixed(2); }
  else if(t.id==='sun'){ sunElev=+t.value; setSun(sunElev); document.getElementById('sunO').textContent=sunElev+'°'; }
  else if(t.id==='explode'){ explodeSetting=+t.value; explodeTarget=explodeSetting; document.getElementById('explodeO').textContent=Math.round(explodeSetting*100)+'%'; }
  else if(t.dataset.layer){ layerVis[t.dataset.layer]=t.checked; applyMode(); }
});
if('ResizeObserver' in window) new ResizeObserver(()=>layout()).observe(panel);

function runStep(i){
  activeStep=i;
  const s=STEPS[i];
  Object.values(PATHS).forEach(p=>p.target=0.1);
  s.bursts.forEach(([k,m,n,delay,loops])=>{ PATHS[k].target=0.9; burst(k,m,n,delay,loops,true); });
  nodeLabels.forEach((L,j)=>L.el.classList.toggle('on',j===i));
  renderPanel();
}
function startPlay(){
  playing=true; let i=0;
  const next=()=>{ if(!playing) return; runStep(i); i=(i+1)%STEPS.length; playTimer=setTimeout(next,i===0?4200:3100); };
  next();
}
function stopPlay(){ if(!playing) return; playing=false; clearTimeout(playTimer); if(mode==='pathway') renderPanel(); }

/* ================= PICKING ================= */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
let downXY=null;
canvas.addEventListener('pointerdown',e=>{ downXY=[e.clientX,e.clientY]; });
canvas.addEventListener('pointerup',e=>{
  if(!downXY || Math.hypot(e.clientX-downXY[0],e.clientY-downXY[1])>6 || transitioning) return;
  ndc.set(e.clientX/VW*2-1,-(e.clientY/VH)*2+1); ray.setFromCamera(ndc,camera);
  if(mode==='plant'){
    const h=ray.intersectObjects(heroLeaves,false)[0];
    if(h){ const n=h.face.normal.clone().transformDirection(h.object.matrixWorld); if(n.dot(camera.position.clone().sub(h.point))<0) n.negate(); go('kranz',{hit:{point:h.point.clone(),normal:n}}); }
  } else if(mode==='kranz'){
    const h=ray.intersectObjects(pickables,false).find(x=>{ let o=x.object; while(o){ if(!o.visible) return false; o=o.parent; } return true; });
    if(h && h.object.userData.kind){ selectedTissue=h.object.userData.kind; renderPanel(); }
  }
});
canvas.addEventListener('pointermove',e=>{
  if(mode!=='plant' || e.buttons) { canvas.style.cursor=''; return; }
  ndc.set(e.clientX/VW*2-1,-(e.clientY/VH)*2+1); ray.setFromCamera(ndc,camera);
  canvas.style.cursor = ray.intersectObjects(heroLeaves,false).length ? 'pointer' : '';
});

/* ================= LOOP ================= */
const clock=new THREE.Clock();
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),0.05), t=clock.elapsedTime;
  if(activeScene===plantScene){
    leafUniforms.uTime.value=t;
    const w=reduce?windSetting*0.25:windSetting;
    leafUniforms.uWind.value += (w-leafUniforms.uWind.value)*Math.min(1,dt*3);
    sky.position.copy(camera.position);
  } else {
    explode += (explodeTarget-explode)*Math.min(1,dt*4);
    gVasc.position.z=explode*2.0; gBS.position.z=explode*1.0; gEpi.position.z=-explode*1.0;
    const newDim = dim + (dimTarget-dim)*Math.min(1,dt*3);
    if(Math.abs(newDim-dim)>1e-4){ dim=newDim; shared.forEach(m=>m.color.copy(m.userData.base).multiplyScalar(dim)); }
    if(mode==='pathway'){
      Object.values(PATHS).forEach(p=>{ p.tube.material.opacity += (p.target-p.tube.material.opacity)*Math.min(1,dt*4); });
      focusRings.forEach((r,i)=>r.material.opacity=0.35+0.25*Math.sin(t*2.2+i));
      nodeDots.forEach((d,i)=>d.scale.setScalar(1+(i===activeStep?0.5+0.3*Math.sin(t*6):0.15*Math.sin(t*2+i))));
      calvinTorus.rotation.z=-t*0.8;
      ambient(dt);
    }
    if(PW.visible) updateParticles(dt);
  }
  stepTween();
  if(!tween) controls.update();
  renderer.render(activeScene,camera);
  updateLabels();
}
addEventListener('resize',layout);
renderPanel(); layout(); applyMode(); setControlsFor('plant');
{ const v=VIEWS.plant(); camera.position.copy(v.p); controls.target.copy(v.t); camera.lookAt(v.t); }
frame();
})();
</script>

</body>
